name: RippleRun
options:
  bundleIdPrefix: com.ripplerun
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  SWIFT_VERSION: "5.0"
targets:
  RippleLoop:
    type: application
    platform: iOS
    sources:
      - RippleLoop
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.rippleloop.game
      INFOPLIST_FILE: RippleLoop/Info.plist
      TARGETED_DEVICE_FAMILY: "1"
  RippleLoopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RippleLoopTests
    dependencies:
      - target: RippleLoop
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.rippleloop.game.tests